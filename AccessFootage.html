<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="scene">
    <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="fisheye" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feImage id="fisheye-map" result="map" preserveAspectRatio="none"/>
          <feDisplacementMap in="SourceGraphic" in2="map" scale="300" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
    <div id="video-wrap">
      <video id="random-video" autoplay loop playsinline></video>
    </div>
    <div id="crt"></div>
    <div id="video-edge"></div>
    <div id="video-title"></div>
    <div id="start-screen"><span>Click to start</span></div>
  </div>
  <div id="site-title">Random Access Footage</div>
  <div id="top-line"></div>
  <nav id="top-nav">
    <a href="index.html">Menu</a>
    <span>Gambling Game</span>
    <a href="Timer.html">Study Timer</a>
    <span>Puzzle Solver</span>
    <span>Support</span>
  </nav>
  <div id="cursor"></div>


  <script src="script.js"></script>
  <script src="cursor.js"></script>
</body>
</html>
